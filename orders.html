<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | PRINT</title>
    <link href="https://fonts.googleapis.com/css2?family=Jaro&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="orders.css">
    
    <!-- BAGONG CSS PARA SA SCROLL -->
    <style>
        #ordersContainer {
            max-height: 480px; /* Hanggang 5 orders lang ang kita */
            overflow-y: auto;
            padding-right: 10px;
        }
        /* Custom Scrollbar para maganda */
        #ordersContainer::-webkit-scrollbar {
            width: 8px;
        }
        #ordersContainer::-webkit-scrollbar-track {
            background: transparent;
        }
        #ordersContainer::-webkit-scrollbar-thumb {
            background-color: #6b7c6b;
            border-radius: 10px;
        }
        #ordersContainer::-webkit-scrollbar-thumb:hover {
            background-color: #203B32;
        }
    </style>
</head>
<body>
<div class="orders-page">
    <!-- HEADER -->
    <header class="service-header">
        <a href="dashboard.html" class="brand">
            <img src="Printer.png" alt="PRINT Logo">
            <span>PRINT</span>
        </a>

        <div class="nav-actions-wrapper">
            <nav class="main-navigation" id="mainNav">
                <button class="close-menu" id="closeMenu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <a href="dashboard.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H14V14H10V20H3Z"/></svg><span>HOME</span></a>
                <a href="how it works.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9A2.5 2.5 0 0 1 14 10.5C14 12 12 12 12 14"/><path d="M12 17.5V17.6"/></svg><span>HOW IT WORKS</span></a>
                <a href="price list selection.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M20 13L11 22L2 13V4H11Z"/><circle cx="7" cy="9" r="1"/></svg><span>PRICE LIST</span></a>
                <a href="orders.html" class="nav-link active"><svg viewBox="0 0 24 24"><path d="M6 3H15L20 8V21H6Z"/><path d="M15 3V8H20"/><path d="M9 13H16M9 17H16"/></svg><span>ORDERS</span></a>
                <a href="profile.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21C4 16 7 14 12 14C17 14 20 16 20 21"/></svg><span>PROFILE</span></a>
            </nav>

            <div class="notification-wrapper">
                <button class="notification-link has-unread" id="notificationBtn" aria-label="Notifications">
                    <svg viewBox="0 0 24 24">
                        <path d="M18 8.5C18 5 15.5 3 12 3S6 5 6 8.5C6 15 4 17 3 18H21C20 17 18 15 18 8.5Z"/>
                        <path d="M9.5 21H14.5"/>
                    </svg>
                </button>
                <div class="notif-overlay" id="notifOverlay">
                    <button class="notif-close" id="notifClose"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></button>
                    <h2>Notifications</h2>
                    <div class="notif-list">
                        <div class="notif-item unread">
                            <div class="notif-icon"><svg viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></div>
                            <div class="notif-content"><h3>Printing in Progress</h3><p>Your order is now being processed.</p><span>Just now</span></div>
                        </div>
                    </div>
                    <button class="notif-mark-read" id="notifMarkRead">Mark all as read</button>
                </div>
            </div>

            <button class="menu-toggle" id="menuToggle">
                <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
        </div>
        <div class="menu-overlay" id="menuOverlay"></div>
    </header>

    <main class="service-content">
        <section class="page-title-section">
            <h1>My Orders</h1>
            <p>Check the status of your recent orders</p>
        </section>

        <div class="orders-layout">
            <!-- SIDEBAR FILTERS -->
            <div class="sidebar">
                <div class="filter-item active" data-filter="all">
                    <span>All Orders</span>
                    <span class="count" id="allOrdersCount">0</span>
                </div>
                <div class="filter-item" data-filter="processing">
                    <span>Processing</span>
                    <span class="count" id="processingCount">0</span>
                </div>
                <div class="filter-item" data-filter="completed">
                    <span>Completed</span>
                    <span class="count" id="completedCount">0</span>
                </div>
            </div>

            <!-- ORDERS LIST -->
            <div class="orders-main">
                <div class="orders-header">
                    <h2>Recent Orders</h2>
                    <div class="sort-dropdown">
    <select id="sortSelect">
        <option value="newest">Sort by: Newest</option>
        <option value="oldest">Sort by: Oldest</option>
    </select>
</div>
                </div>

                <div class="orders-container" id="ordersContainer">
                    <!-- Dito papasok ang mga order cards via JS -->
                </div>
            </div>
        </div>
    </main>

    <img src="Foreground landscape.png" class="foreground-landscape" alt="">
    <img src="Landscape.png" class="landscape" alt="">
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // NAVIGATION & NOTIFICATION
    const menuToggle = document.getElementById("menuToggle"), closeMenu = document.getElementById("closeMenu"), mainNav = document.getElementById("mainNav"), menuOverlay = document.getElementById("menuOverlay");
    if(menuToggle) menuToggle.addEventListener("click", () => { mainNav.classList.add("active"); menuOverlay.classList.add("active"); });
    if(closeMenu) closeMenu.addEventListener("click", () => { mainNav.classList.remove("active"); menuOverlay.classList.remove("active"); });
    if(menuOverlay) menuOverlay.addEventListener("click", () => { mainNav.classList.remove("active"); menuOverlay.classList.remove("active"); });

    const notifBtn = document.getElementById("notificationBtn"), notifOverlay = document.getElementById("notifOverlay"), notifClose = document.getElementById("notifClose"), notifMarkRead = document.getElementById("notifMarkRead");
    if (notifBtn) notifBtn.addEventListener("click", (e) => { e.stopPropagation(); notifOverlay.classList.toggle("active"); });
    if (notifClose) notifClose.addEventListener("click", () => notifOverlay.classList.remove("active"));
    if (notifMarkRead) notifMarkRead.addEventListener("click", () => { document.querySelectorAll(".notif-item.unread").forEach(i => i.classList.remove("unread")); notifMarkRead.style.display = "none"; });

    // ==========================================
    // ORDERS LOGIC
    // ==========================================
    let savedOrders = [];
    try {
        savedOrders = JSON.parse(localStorage.getItem("myOrdersHistory")) || [];
    } catch(e) {
        savedOrders = [];
    }

    const ordersContainer = document.getElementById("ordersContainer");
    const allOrdersCount = document.getElementById("allOrdersCount");
    const processingCount = document.getElementById("processingCount");
    const completedCount = document.getElementById("completedCount");
    
    let currentFilter = "all";
    let currentSort = "newest";

    // ==========================================
    // HELPER: AYUSIN ANG DATE FORMAT
    // ==========================================
    // Ginagawa nitong valid Date object yung "Nov 12, 2026 - 06:36 PM"
    function getTimestamp(dateStr) {
        if (!dateStr) return 0;
        // Palitan ang " - " ng space para mabasa ng Date()
        let formattedStr = dateStr.replace(" - ", " ");
        let time = new Date(formattedStr).getTime();
        // Kung mag-error pa rin, fallback sa 0
        return isNaN(time) ? 0 : time;
    }

    // ==========================================
    // RENDER FUNCTION
    // ==========================================
    function renderOrders() {
        // 1. FILTER
        let filteredOrders = savedOrders.filter(order => {
            if (currentFilter === "all") return true;
            if (currentFilter === "processing") return order.status !== "Completed" && order.status !== "Delivered";
            if (currentFilter === "completed") return order.status === "Completed" || order.status === "Delivered";
            return true;
        });

        // 2. SORT (Gamit ang getTimestamp helper)
        filteredOrders.sort((a, b) => {
            const dateA = getTimestamp(a.date);
            const dateB = getTimestamp(b.date);

            if (currentSort === "newest") return dateB - dateA; 
            else return dateA - dateB; 
        });

        // 3. RENDER
        ordersContainer.innerHTML = "";
        
        if (filteredOrders.length === 0) {
            ordersContainer.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#a5b88f" stroke-width="2" style="width: 60px; height: 60px; margin-bottom: 15px;">
                        <path d="M6 3H15L20 8V21H6Z"/><path d="M15 3V8H20"/><path d="M9 13H16M9 17H16"/>
                    </svg>
                    <h3 style="color: #203B32; font-family: 'Jaro', sans-serif; font-size: 22px; margin-bottom: 10px;">No orders found</h3>
                    <p style="font-size: 13px; color: #666; margin-bottom: 20px;">There are no orders in this category.</p>
                </div>
            `;
            return;
        }

        filteredOrders.forEach(order => {
            const statusClass = (order.status === "Completed" || order.status === "Delivered") ? "completed" : "processing";
            
            let fileCount = order.files ? order.files.length : 1;
            let firstName = (order.files && order.files.length > 0) ? order.files[0].name : "Document";
            let descText = fileCount + " file(s) - " + firstName;
            
            let imgSrc = "Documentation_Preview.png"; 
            if (order.service && order.service.includes("Photo")) imgSrc = "Photo.png";
            if (order.service && order.service.includes("Tarpaulin")) imgSrc = "Tarpaulin.png";

            const card = document.createElement("div");
            card.className = "order-card";
            card.innerHTML = `
                <div class="order-image">
                    <img src="${imgSrc}" alt="Preview">
                </div>
                <div class="order-details">
                    <div class="order-top">
                        <span class="order-id">${order.orderId || "PR-0000"}</span>
                        <span class="status ${statusClass}">${order.status || "Processing"}</span>
                    </div>
                    <h3>${order.service || "Document Printing"}</h3>
                    <p class="order-desc">${descText}</p>
                    <p class="order-date">${order.date || "Just now"}</p>
                </div>
                <div class="order-price-status">
                    <span class="price-label">Total</span>
                    <span class="price-value">₱${order.total || "0.00"}</span>
                </div>
                <div class="order-action">
                    <button class="btn-track" onclick="window.location.href='${order.trackLink || 'track document.html'}'">Track Order ></button>
                </div>
            `;
            ordersContainer.appendChild(card);
        });
    }

    // ==========================================
    // COUNTING & INITIALIZATION
    // ==========================================
    let procCount = 0, compCount = 0;
    savedOrders.forEach(o => { 
        if (o.status === "Completed" || o.status === "Delivered") compCount++; 
        else procCount++; 
    });
    
    allOrdersCount.textContent = savedOrders.length; 
    processingCount.textContent = procCount; 
    completedCount.textContent = compCount;

    renderOrders();

    // ==========================================
    // FILTER CLICKS
    // ==========================================
    const filterItems = document.querySelectorAll(".sidebar .filter-item");
    filterItems.forEach(item => {
        item.addEventListener("click", function() {
            filterItems.forEach(i => i.classList.remove("active"));
            this.classList.add("active");
            
            currentFilter = this.dataset.filter;
            renderOrders();
        });
    });

    // ==========================================
    // SORT DROPDOWN
    // ==========================================
    const sortDropdown = document.getElementById("sortSelect");
    if (sortDropdown) {
        sortDropdown.addEventListener("change", function() {
            currentSort = this.value; 
            renderOrders();
        });
    }
});
</script>
</body>
</html>
