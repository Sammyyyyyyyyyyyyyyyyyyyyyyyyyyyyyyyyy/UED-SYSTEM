<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price List | PRINT</title>
    <link href="https://fonts.googleapis.com/css2?family=Jaro&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="price list selection.css">
</head>
<body>

<div class="price-list-page">
    <header class="service-header">
        <a href="dashboard.html" class="brand">
            <img src="Printer.png" alt="PRINT Logo">
            <span>PRINT</span>
        </a>

        <div class="nav-actions-wrapper">
            <nav class="main-navigation" id="mainNav">
                <button class="close-menu" id="closeMenu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <a href="dashboard.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M3 10L12 3L21 10V20H14V14H10V20H3Z"/></svg><span>HOME</span></a>
                <a href="how it works.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9A2.5 2.5 0 0 1 14 10.5C14 12 12 12 12 14"/><path d="M12 17.5V17.6"/></svg><span>HOW IT WORKS</span></a>
                <a href="price list selection.html" class="nav-link active"><svg viewBox="0 0 24 24"><path d="M20 13L11 22L2 13V4H11Z"/><circle cx="7" cy="9" r="1"/></svg><span>PRICE LIST</span></a>
                <a href="orders.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M6 3H15L20 8V21H6Z"/><path d="M15 3V8H20"/><path d="M9 13H16M9 17H16"/></svg><span>ORDERS</span></a>
                <a href="profile.html" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21C4 16 7 14 12 14C17 14 20 16 20 21"/></svg><span>PROFILE</span></a>
            </nav>

            <div class="notification-wrapper">
                <button class="notification-link has-unread" id="notificationBtn"><svg viewBox="0 0 24 24"><path d="M18 8.5C18 5 15.5 3 12 3S6 5 6 8.5C6 15 4 17 3 18H21C20 17 18 15 18 8.5Z"/><path d="M9.5 21H14.5"/></svg></button>
                <div class="notif-overlay" id="notifOverlay">
                    <button class="notif-close" id="notifClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></button>
                    <h2>Notifications</h2>
                    <div class="notif-list">
                        <div class="notif-item unread">
                            <div class="notif-icon"><svg viewBox="0 0 24 24"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></div>
                            <div class="notif-content"><h3>Printing in Progress</h3><p>Your document order is now being processed.</p><span>Just now</span></div>
                        </div>
                    </div>
                    <button class="notif-mark-read" id="notifMarkRead">Mark all as read</button>
                </div>
            </div>

            <button class="menu-toggle" id="menuToggle"><svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        </div>
        <div class="menu-overlay" id="menuOverlay"></div>
    </header>

    <main class="service-content">
        <section class="how-title-section">
            <h1>PRINT Price List</h1>
            <p>Check our printing rates before placing your order.</p>
        </section>

        <div class="price-card-wrapper">
            <div class="price-card">
                <button id="btn-document" class="price-button">DOCUMENT PRINTING</button>
                <button id="btn-photo" class="price-button">PHOTO PRINTING</button>
                <button id="btn-tarpaulin" class="price-button">TARPAULIN PRINTING</button>
            </div>
        </div>
    </main>

    <img src="Foreground landscape.png" class="foreground-landscape" alt="">
    <img src="Landscape.png" class="landscape" alt="">
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const menuToggle = document.getElementById("menuToggle");
        const closeMenu = document.getElementById("closeMenu");
        const mainNav = document.getElementById("mainNav");
        const menuOverlay = document.getElementById("menuOverlay");

        if (menuToggle) menuToggle.addEventListener("click", () => { mainNav.classList.add("active"); menuOverlay.classList.add("active"); });
        if (closeMenu) closeMenu.addEventListener("click", () => { mainNav.classList.remove("active"); menuOverlay.classList.remove("active"); });
        if (menuOverlay) menuOverlay.addEventListener("click", () => { mainNav.classList.remove("active"); menuOverlay.classList.remove("active"); });

        const notifBtn = document.getElementById('notificationBtn');
        const notifOverlay = document.getElementById('notifOverlay');
        const notifClose = document.getElementById('notifClose');
        const notifMarkRead = document.getElementById('notifMarkRead');

        if (notifBtn) notifBtn.addEventListener('click', (e) => { e.stopPropagation(); notifOverlay.classList.toggle('active'); });
        if (notifClose) notifClose.addEventListener('click', () => notifOverlay.classList.remove('active'));
        document.addEventListener('click', (e) => { if (notifOverlay && notifOverlay.classList.contains('active') && !notifOverlay.contains(e.target) && !notifBtn.contains(e.target)) notifOverlay.classList.remove('active'); });
        if (notifMarkRead) notifMarkRead.addEventListener('click', () => { document.querySelectorAll('.notif-item.unread').forEach(item => item.classList.remove('unread')); notifBtn.classList.remove('has-unread'); });

        document.getElementById("btn-document").addEventListener("click", () => window.location.href = "document price.html");
        document.getElementById("btn-photo").addEventListener("click", () => window.location.href = "photo price.html");
        document.getElementById("btn-tarpaulin").addEventListener("click", () => window.location.href = "tarpaulin price.html");
    });
</script>

</body>
</html>
